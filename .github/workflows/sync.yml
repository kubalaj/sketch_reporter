name: Sync rides

on:
  schedule:
    # 03:07 UTC every day: 7:07pm Pacific in winter, 8:07pm in summer.
    - cron: "7 3 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab
    inputs:
      reprice:
        description: Re-price every ride (current config, each ride's own week's gas price)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull rides from Strava
        run: python3 sync.py ${{ inputs.reprice && '--reprice' || '' }}
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rides.json
          git diff --cached --quiet || (git commit -m "Update ride data" && git push)
